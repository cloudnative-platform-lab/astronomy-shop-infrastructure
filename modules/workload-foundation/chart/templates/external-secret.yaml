{{- if .Values.runtimeSecretKey }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: astronomy-shop-runtime
  namespace: {{ .Values.namespace | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: astronomy-shop-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.targetSecretName | quote }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.runtimeSecretKey | quote }}
{{- end }}
{{- if .Values.databaseSecretKey }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: astronomy-shop-database
  namespace: {{ .Values.namespace | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: astronomy-shop-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.databaseSecretName | quote }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.databaseSecretKey | quote }}
{{- end }}
