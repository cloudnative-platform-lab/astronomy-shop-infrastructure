apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        workload: application
    spec:
      expireAfter: 720h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - {{ .Values.architecture | quote }}
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        - key: karpenter.sh/capacity-type
          operator: In
          values:
{{ toYaml .Values.capacityTypes | indent 12 }}
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
{{ toYaml .Values.allowedInstanceTypes | indent 12 }}
  limits:
    cpu: {{ .Values.cpuLimit | quote }}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
