apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: {{ .Values.nodeRoleName | quote }}
  subnetSelectorTerms:
    {{- range .Values.privateSubnetIds }}
    - id: {{ . | quote }}
    {{- end }}
  securityGroupSelectorTerms:
    - id: {{ .Values.nodeSecurityGroupId | quote }}
  tags:
    Name: {{ printf "%s-karpenter" .Values.clusterName | quote }}
    ManagedBy: Karpenter
