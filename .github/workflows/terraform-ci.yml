name: Terraform CI

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars.example"
      - "bootstrap/**"
      - "platform/**"
      - "modules/**"
      - "tests/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tfvars.example"
      - "bootstrap/**"
      - "platform/**"
      - "modules/**"
      - "tests/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    name: Terraform Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

  validate:
    name: Validate ${{ matrix.root }}
    runs-on: ubuntu-latest
    needs: fmt

    strategy:
      fail-fast: false
      matrix:
        root:
          - bootstrap/remote-state
          - bootstrap/shared
          - bootstrap/dev
          - bootstrap/staging
          - bootstrap/prod
          - platform/dev
          - platform/staging
          - platform/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Init without remote backend
        run: terraform -chdir=${{ matrix.root }} init -backend=false

      - name: Validate
        run: terraform -chdir=${{ matrix.root }} validate
